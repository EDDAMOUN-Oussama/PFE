ServerName localhost
ServerTokens Prod
ServerSignature Off
<VirtualHost *:10000>
    DocumentRoot /var/www/healthytrack/public
    <Directory /var/www/healthytrack/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    LimitRequestBody 1048576
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
